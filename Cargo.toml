[package]
name = "tern-claude"
version = "0.1.0"
edition = "2024"
description = "Claude Code sessions as native Tern cards: continue, fork, hide, and keep tabs on the running ones."
license = "MIT"

[dependencies]
tern-sdk = "0.1.0"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
panic = "abort"
